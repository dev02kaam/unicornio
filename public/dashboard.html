<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Proyecto Unicornio</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="shell dashboard-shell">
      <section class="dashboard-hero card">
        <div class="hero-copy">
          <span class="badge">Area privada</span>
          <h1>Bienvenido</h1>
          <p id="dashboard-intro">Estructura inicial. Los módulos funcionales se añadirán en fases posteriores.</p>
        </div>

        <button id="profile-button" class="account-trigger" type="button" aria-label="Abrir perfil">
          <span class="avatar-badge avatar-large" aria-hidden="true">U</span>
        </button>
      </section>

      <section id="admin-panel" class="card admin-panel" hidden>
        <div class="section-header">
          <div>
            <span class="badge">Administración</span>
            <h2>Crear nuevos usuarios</h2>
          </div>
          <p>Acción disponible solo para administradores.</p>
        </div>

        <form id="create-user-form" class="stack admin-form">
          <label>
            <span>Nombre</span>
            <input type="text" name="name" placeholder="Nuevo usuario" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="nuevo@unicornio.local" required />
          </label>
          <label>
            <span>Contraseña</span>
            <input type="password" name="password" placeholder="Demo1234!" required />
          </label>
          <label>
            <span>Rol</span>
            <select name="role">
              <option value="STUDENT">STUDENT</option>
              <option value="FAMILY">FAMILY</option>
              <option value="SCHOOL">SCHOOL</option>
              <option value="PROFESSIONAL">PROFESSIONAL</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </label>
          <p id="create-user-error" class="error" hidden></p>
          <p id="create-user-success" class="success" hidden></p>
          <button class="button primary" type="submit">Crear usuario</button>
        </form>
      </section>

      <section id="admin-users-panel" class="card admin-panel" hidden>
        <div class="section-header">
          <div>
            <span class="badge">Usuarios</span>
            <h2>Listado rápido</h2>
          </div>
          <button id="refresh-users-button" class="button secondary" type="button">Actualizar</button>
        </div>
        <div id="users-list" class="users-list"></div>
      </section>
    </main>

    <section id="profile-modal" class="profile-modal" hidden aria-hidden="true">
      <div class="profile-modal__backdrop" data-close-profile></div>
      <div class="profile-modal__panel card" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
        <div class="section-header">
          <div>
            <span class="badge">Perfil</span>
            <h2 id="profile-modal-title">Datos y preferencias</h2>
          </div>
          <button id="profile-close-button" class="button secondary" type="button">Cerrar</button>
        </div>

        <div class="profile-grid">
          <div class="profile-chip">
            <span>Nombre</span>
            <strong id="profile-name">-</strong>
          </div>
          <div class="profile-chip">
            <span>Email</span>
            <strong id="profile-email">-</strong>
          </div>
          <div class="preferences-card">
            <span class="profile-caption">Preferencias rápidas</span>
            <div class="preferences">
              <label class="toggle-row">
                <input type="checkbox" checked />
                <span>Mostrar pantalla de bienvenida</span>
              </label>
              <label class="toggle-row">
                <input type="checkbox" checked />
                <span>Recordar sesión en este navegador</span>
              </label>
            </div>
          </div>
        </div>

        <div class="action-row modal-actions">
          <button id="modal-logout-button" class="button secondary" type="button">Cerrar sesión</button>
        </div>
      </div>
    </section>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
